# figures.yml — every number the slick sheet prints, and where each one came from.
#
# THIS FILE HOLDS DATA ONLY. All prose (headlines, captions, subtitles, step text)
# lives in copy/slicksheet.md, where a non-programmer can edit it without touching
# numbers. The only text here is the short label naming each chart mark, which stays
# beside the value it names so the two can never drift apart.
#
# RULE (see pdf/README.md): every figure below must trace to a file already published
# under tx-11/august-pfluger/reports/ or tx-11/august-pfluger/README.md. No number here
# was computed for the slick sheet. Each is copied verbatim from its source report, with
# that report's own file and section noted alongside it. build-slicksheet.rb reads only
# this file and the copy deck; it never opens a CSV and never does arithmetic on a total.
#
# Percentages are quoted at the precision their source report published (oil and gas to
# one decimal, the others to two). The build renders them with %g so it never pads a
# figure out to a significant digit the report never claimed.

infographic_1:
  source: "tx-11/august-pfluger/README.md — Major Spending (FEC category totals)"
  # All four are drawn from the same "operating spend by FEC category" breakdown, so
  # they sit honestly on one shared scale. Deliberately NOT mixed with the JFC's
  # inter-committee transfer figures ($2,090,787.64 back to the campaign, $922,789.74
  # to Raptor PAC, $638,886.02 to the NRCC). Those are transfers between committees
  # rather than operating spend, and putting both kinds of money on one axis would
  # overstate the comparison. The transfer story lives in the narrative band instead.
  bars:
    - label: "Administrative, salary & overhead"
      value: 1779330.42
    - label: "Contributions to 235 other GOP candidates"
      value: 1067500.00
    - label: "Fundraising & donor solicitation"
      value: 921673.10
    - label: "Advertising that reaches TX-11 voters"
      value: 133299.71
      highlight: true

infographic_2:
  # Bars are scaled by share of receipts, which is the comparable quantity across
  # industries; the dollar figure rides in each bar's own label.
  scale_max_pct: 30
  rows:
    - label: "Oil & Gas"
      pct: 25.2
      value: 1338669.21
      denominator: 5317758.43
      source: "tx-11/august-pfluger/reports/2026-oil-and-gas.md — The short version (2026-cycle share)"
    - label: "AI & Data Centers"
      pct: 2.45
      value: 130500.00
      denominator: 5317758.43
      source: "tx-11/august-pfluger/reports/2026-datacenters.md — The short version"
    - label: "Automotive"
      pct: 0.78
      value: 41500.00
      denominator: 5317758.43
      source: "tx-11/august-pfluger/reports/2026-automotive.md — The short version"
  # All three rows share one denominator. An earlier printing did not: the data-center
  # report was then running on older exports covering three of the four committees, so
  # its share sat on a $5,257,758.43 base while the other two used $5,317,758.43. That
  # report has since been regenerated against the same exports. The fix was to refresh
  # the report, never to re-divide the numerator here.

