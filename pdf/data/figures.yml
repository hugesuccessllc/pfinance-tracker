infographic_4:
  source: "tx-11/august-pfluger/reports/2026-outside-texas.md"
  pct_contributions_out_of_state: 67.6
  pct_dollars_out_of_state: 26.8
  pct_contributions_out_of_state_2026: 84.4
  # Full names, not postal abbreviations, per the operator's request; the panel has
  # room. This is a naming expansion, not a computed figure: DC/VA/CA to their
  # unambiguous full names, no new data derived. The source report above (this
  # block's own `source:`) uses the abbreviations; no separate cited_in_copy entry
  # is needed since these values live here as chart-mark data, not in the copy deck.
  top_states:
    - label: "Washington, D.C."
      value: 1356387.28
    - label: "Virginia"
      value: 757986.01
    - label: "California"
      value: 329438.92

verify_page:
  # All four of Pfluger's 2026-cycle committees, matching the "four committees" the
  # copy states elsewhere on the sheet. Keep this list and every "four committees"
  # claim in copy/slicksheet.md in sync: this repo already shipped one print run where
  # they had drifted apart (masthead said five, the box listed three).
  committees:
    - id: "C00719294"
      name: "August Pfluger for Congress (principal campaign committee)"
    - id: "C00753913"
      name: "Pfluger Victory Fund (joint fundraising committee)"
    - id: "C00749481"
      name: "Raptor PAC (leadership PAC)"
    - id: "C00840033"
      name: "PFriends of Pfluger (joint fundraising committee, minimal 2026 activity)"

footer:
  qr_target: "https://claire11.org"

# ---------------------------------------------------------------------------
# CITATION LEDGER (provenance only, never rendered)
#
# The copy deck quotes figures inside sentences, where a `source:` key cannot live.
# Those citations live here instead, so rule 4 still holds: every number printed on the
# sheet traces to an already-published report. Nothing below is drawn on the page.
#
# If you change a quoted figure in copy/slicksheet.md, change its entry here too. If a
# figure is not in a published report yet, go write that report first.
cited_in_copy:
  - figure: "$5.3 million raised across four committees"
    exact: 5317758.43
    slots: ["masthead.dek", "narrative.bullets"]
    source: >
      tx-11/august-pfluger/README.md — opening summary ("August Pfluger's 2026-cycle
      money runs through four committees"). The masthead originally miscounted this as
      "Five committees," caught only when the verify-page committee-ID box (which lists
      real IDs and is harder to get wrong silently) was checked against it and came up
      one short in the other direction. Both are now four, matching each other and the
      source.
  - figure: "The four committee IDs (C00719294, C00753913, C00749481, C00840033)"
    slots: ["verify_page.committees", "footer.source_note"]
    source: >
      tx-11/august-pfluger/README.md — opening summary and Methodology (committee list).
      All four appear in both the page-2 ID box and the footer source note. The fourth,
      PFriends of Pfluger, is characterized there as "minimal 2026 activity" (a single
      $5,000 receipt from E-PAC, fully refunded, net zero) per the source report's own
      Methodology section, which is why the verify-page steps still describe only three
      committees as the ones worth actually searching. Listing four is a completeness
      fix, not a claim that the fourth carries meaningful money.
  - figure: "$642,100 from a single Midland oil executive, described as practically
      equal to the principal committee's entire donor total"
    exact: 642100.00
    slots: ["narrative.bullets"]
    source: >
      tx-11/august-pfluger/README.md — Key Donors (Syed Javaid Anwar) and Takeaway 2.
      Only $642,100 is printed on the sheet; the "practically equal to" comparison
      depends on the principal committee's own total, $642,408.43, a $308.43 (0.05%)
      difference the source report itself calls "nearly a rounding match." That second
      figure is not printed, by request, since two nearly identical six-figure numbers
      side by side read as confusing rather than as the point being made. If either
      figure is ever restated as a printed digit again, both must appear, since the
      claim is a comparison between them.
  - figure: "$15,001 to $50,000 stakes in six companies, three of them oil and gas"
    slots: ["narrative.bullets"]
    source: >
      tx-11/august-pfluger/README.md — Takeaway 4 (Dorchester Minerals, Enterprise
      Products Partners, and Viper Energy among six March 2026 purchases; House Energy
      and Commerce). These are the disclosure ranges House Ethics filings report, not
      exact amounts, which is why no `exact` value is recorded here.
  - figure: "eight times more to other candidates than to ads; seven times more to fundraising"
    slots: ["panel.spending.caption"]
    source: >
      tx-11/august-pfluger/README.md — Major Spending. Ratios of the same four category
      totals charted in infographic_1 above, rounded down to the nearest whole multiple.
  - figure: "$638,886.02 transferred to the national party"
    exact: 638886.02
    slots: ["panel.spending.caption"]
    source: "tx-11/august-pfluger/README.md — opening summary (NRCC transfer)"
  - figure: "$5,317,758.43 shared denominator"
    exact: 5317758.43
    slots: ["panel.industry.footnote"]
    source: "tx-11/august-pfluger/README.md — opening summary"
  - figure: "$583,137 of luxury spending in this cycle"
    exact: 583137.27
    slots: ["panel.luxury.strip"]
    source: "tx-11/august-pfluger/reports/2026-luxury-spending.md — The math, laid plain"
  - figure: "$150,000 initiation fee at Baltusrol Golf Club"
    exact: 150000.00
    slots: ["panel.luxury.caption"]
    source: "tx-11/august-pfluger/reports/2026-luxury-spending.md — Retreats and resorts"
  - figure: "The Capital Grille: $90,570.39 across 125 visits"
    exact: 90570.39
    slots: ["panel.luxury.caption", "verify.searches"]
    source: >
      tx-11/august-pfluger/reports/2026-luxury-spending.md — Fine dining. SCOPE MATTERS:
      this is every cycle from 2020 through 2026 combined, not the 2026 cycle alone. The
      report does not break this vendor out by cycle, so the copy says "since 2020"
      rather than implying it is a single-cycle figure. Do not restate it as this-cycle
      without first publishing a per-cycle number in that report.
  - figure: "84.4% of contributions from outside Texas this cycle"
    slots: ["panel.geography.stat_label"]
    source: "tx-11/august-pfluger/reports/2026-outside-texas.md — The trend, cycle by cycle"
  - figure: "14.8% of contributions from outside Texas in his first race"
    slots: ["panel.geography.caption"]
    source: "tx-11/august-pfluger/reports/2026-outside-texas.md — The trend, cycle by cycle (2020)"
